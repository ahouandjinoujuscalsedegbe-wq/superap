name: Créer la clé de signature

# À lancer UNE SEULE FOIS, avant la première compilation Release.
# Il crée la clé qui signe vos APK. Gardez-la précieusement : sans elle,
# les futures mises à jour ne pourront plus s'installer par-dessus
# l'application existante (vos données seraient perdues).
"on":
  workflow_dispatch:
    inputs:
      mot_de_passe:
        description: "Mot de passe de la clé (8 caractères minimum, notez-le !)"
        required: true

jobs:
  cle:
    runs-on: ubuntu-latest
    steps:
      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Générer la clé
        env:
          MDP: ${{ inputs.mot_de_passe }}
        run: |
          if [ "${#MDP}" -lt 8 ]; then
            echo "::error::Le mot de passe doit contenir au moins 8 caractères."
            exit 1
          fi

          # JKS est utilisé explicitement pour une compatibilité Android maximale.
          keytool -genkeypair -v \
            -keystore cle-signature.jks \
            -storetype JKS \
            -alias superapp \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$MDP" -keypass "$MDP" \
            -dname "CN=SUPER APP, OU=Personnel, O=SUPER APP, L=Porto-Novo, C=BJ"
          
          # Vérification immédiate
          echo "Vérification de la clé générée..."
          keytool -list -keystore cle-signature.jks -storepass "$MDP" -alias superapp
          
          # Encodage Base64 (sans retour à la ligne) pour faciliter le copier-coller
          base64 -w0 cle-signature.jks > cle-signature.base64.txt
          OCTETS=$(wc -c < cle-signature.jks)
          EMPREINTE=$(sha256sum cle-signature.jks | cut -d' ' -f1)
          
          echo "Génération du fichier d'instructions..."
          cat > INSTRUCTIONS.txt <<EOF
          CONFIGURATION DES SECRETS GITHUB POUR LA SIGNATURE ANDROID

          Pour que la compilation Release fonctionne, vous devez ajouter les 4 secrets suivants dans GitHub (Settings > Secrets and variables > Actions) :

          1. ANDROID_KEYSTORE_BASE64 : Copiez-collez tout le contenu du fichier 'cle-signature.base64.txt' (c'est une longue chaîne de caractères).
          2. ANDROID_KEYSTORE_PASSWORD : Le mot de passe que vous avez choisi : $MDP
          3. ANDROID_KEY_ALIAS : superapp
          4. ANDROID_KEY_PASSWORD : Le même mot de passe : $MDP

          CONTRÔLE APRÈS COPIE :
          - Taille attendue de la clé décodée : $OCTETS octets
          - Empreinte SHA-256 attendue : $EMPREINTE
          Si la compilation affiche une autre taille ou empreinte, le Base64 a été mal copié.

          CONSEIL : Téléchargez l'artefact 'cle-signature' de ce workflow et conservez le fichier 'cle-signature.jks' en lieu sûr (Cloud, clé USB). Si vous perdez cette clé, vous ne pourrez plus mettre à jour votre application sur le Play Store ou chez vos utilisateurs.
          EOF
          
          echo "Clé créée et vérifiée avec succès."
          echo "Taille : $OCTETS octets"
          echo "Empreinte SHA-256 : $EMPREINTE"

      - name: Publier la clé (à conserver en lieu sûr)
        uses: actions/upload-artifact@v4
        with:
          name: cle-signature
          path: |
            cle-signature.jks
            cle-signature.base64.txt
            INSTRUCTIONS.txt
          retention-days: 7
