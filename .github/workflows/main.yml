name: Compiler l'APK Android

# Ce workflow compile l'application mobile Android en version Release signée.
# Il se lance manuellement depuis GitHub : onglet "Actions" →
# "Compiler l'APK Android" → bouton "Run workflow".
# Prérequis : lancer une fois le workflow "Créer la clé de signature",
# puis enregistrer les secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS et ANDROID_KEY_PASSWORD.
"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      # 1. Récupérer le code source du projet
      - name: Récupérer le code
        uses: actions/checkout@v4

      # 2. Installer Bun (gestionnaire de paquets du projet)
      - name: Installer Bun
        uses: oven-sh/setup-bun@v2

      # 3. Installer les dépendances du projet
      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      # 4. Construire la version web mobile (fichiers statiques)
      - name: Construire l'application web mobile
        run: bunx vite build --config vite.mobile.config.ts

      # 5. Créer le projet Android natif et y copier l'application
      - name: Préparer la coque Android (Capacitor)
        run: |
          bunx cap add android
          bunx cap sync android

      # 6. Installer Java (nécessaire pour compiler Android)
      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 7. Installer les outils Android
      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      # 8. Reprendre le numéro de version depuis src/lib/version.ts
      - name: Appliquer le numéro de version
        run: |
          VERSION=$(grep -oP 'VERSION_APPLICATION = "\K[0-9.]+' src/lib/version.ts)
          CODE=$(echo "$VERSION" | awk -F. '{printf "%d%03d%03d", $1, $2, $3}')
          echo "Version compilée : $VERSION (code $CODE)"
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" android/app/build.gradle
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # 9. Installer la clé de signature depuis les secrets du dépôt
      - name: Préparer la signature Release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Clé de signature absente. Lancez d'abord le workflow 'Créer la clé de signature' puis enregistrez les 4 secrets ANDROID_*."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/cle-signature.jks
          cp signature-release.gradle android/app/signature-release.gradle
          echo "apply from: 'signature-release.gradle'" >> android/app/build.gradle

      # 10. Compiler l'APK Release signé
      - name: Compiler l'APK Release
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # 11. Préparer l'APK et le fichier version.json de l'auto-updater
      - name: Préparer les fichiers de publication
        run: |
          mkdir -p publication
          cp android/app/build/outputs/apk/release/app-release.apk "publication/super-app-$VERSION.apk"
          BASE="https://github.com/${{ github.repository }}/releases/latest/download"
          printf '{\n  "version": "%s",\n  "url": "%s/super-app-%s.apk",\n  "changelog": "Nouvelle version %s de SUPER APP."\n}\n' \
            "$VERSION" "$BASE" "$VERSION" "$VERSION" > publication/version.json
          cat publication/version.json

      # 12. Rendre l'APK signé téléchargeable depuis la page du workflow
      - name: Publier l'APK en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: super-app-apk
          path: publication/
          retention-days: 30
