name: Compiler l'APK Android

# Ce workflow compile l'application mobile Android.
# Lancement : onglet "Actions" → "Compiler l'APK Android" → "Run workflow".
#
# Si les 4 secrets ANDROID_* sont enregistrés, l'APK est compilé en version
# Release SIGNÉE (recommandé, permet les mises à jour par-dessus l'app).
# S'ils sont absents, le workflow ne échoue plus : il compile un APK de test
# (debug) pour que vous ayez quand même une application installable.
#
# Dépôt PRIVÉ : le jeton GitHub n'est PLUS intégré à l'application. Il est
# enregistré côté serveur (secret SUPERAPP_UPDATE_TOKEN du projet Lovable) et
# l'application interroge le relais /api/public/maj/version.
"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      # 1. Récupérer le code source du projet
      - name: Récupérer le code
        uses: actions/checkout@v5

      # 2. Installer Bun (gestionnaire de paquets du projet)
      - name: Installer Bun
        uses: oven-sh/setup-bun@v2

      # 3. Installer les dépendances du projet
      - name: Installer les dépendances
        run: bun install --frozen-lockfile || bun install

      # 4. Construire la version web mobile (fichiers statiques)
      # Le jeton GitHub (lecture seule) est intégré à l'application pour que
      # l'auto-updater puisse lire les Releases même si le dépôt est privé.
      # Empreinte du certificat de signature : intégrée à l'application pour
      # qu'elle refuse de démarrer si elle a été recompilée par un tiers.
      - name: Calculer l'empreinte de signature attendue
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::warning::Pas de clé de signature : contrôle d'authenticité désactivé."
            echo "SIGNATURE_ATTENDUE=" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > /tmp/signature.jks
          EMPREINTE=$(keytool -list -v -keystore /tmp/signature.jks -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" | grep -m1 "SHA256:" | awk '{print $2}' | tr -d ':' | tr 'A-Z' 'a-z')
          if [ -z "$EMPREINTE" ]; then
            echo "::error::Impossible de lire l'empreinte du certificat de signature."
            exit 1
          fi
          echo "SIGNATURE_ATTENDUE=$EMPREINTE" >> "$GITHUB_ENV"
          echo "Empreinte de signature attendue : $EMPREINTE"

      - name: Refuser toute clé de signature versionnée
        run: |
          # La clé de signature ne doit jamais se trouver dans le dépôt :
          # quiconque la possède peut publier une fausse mise à jour.
          if git ls-files | grep -Ei '\.(jks|keystore|p12)$'; then
            echo "::error::Une clé de signature est versionnée dans le dépôt. Supprimez-la et régénérez-la."
            exit 1
          fi
          echo "Aucune clé de signature versionnée."

      - name: Construire l'application web mobile
        env:
          VITE_SIGNATURE_ATTENDUE: ${{ env.SIGNATURE_ATTENDUE }}
        run: bunx vite build --config vite.mobile.config.ts

      # 5. Installer Java (nécessaire pour compiler Android)
      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # 6. Installer les outils Android
      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      # 7. Créer le projet Android natif et y copier l'application
      - name: Préparer la coque Android (Capacitor)
        run: |
          if [ ! -d android ]; then bunx cap add android; fi
          bunx cap sync android

      - name: Appliquer l'icône personnalisée de l'application
        run: |
          # Les icônes générées depuis le logo utilisateur sont copiées dans
          # les dossiers mipmap du projet Android natif.
          cp resources/android/icons/icon-48.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp resources/android/icons/icon-72.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp resources/android/icons/icon-96.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp resources/android/icons/icon-144.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp resources/android/icons/icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp resources/android/icons/icon-48.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp resources/android/icons/icon-72.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp resources/android/icons/icon-96.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp resources/android/icons/icon-144.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp resources/android/icons/icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          echo "Icônes de l'application appliquées."

      - name: Appliquer l'écran de démarrage personnalisé
        run: |
          # L'image de démarrage est copiée dans tous les dossiers drawable
          # existants du projet Android natif (portrait, paysage, densités).
          RES=android/app/src/main/res
          mkdir -p "$RES/drawable"
          cp resources/android/splash/splash.png "$RES/drawable/splash.png"
          for d in "$RES"/drawable-*; do
            [ -d "$d" ] || continue
            case "$d" in
              *land*) cp resources/android/splash/splash-land.png "$d/splash.png" ;;
              *port*) cp resources/android/splash/splash-port.png "$d/splash.png" ;;
              *) cp resources/android/splash/splash.png "$d/splash.png" ;;
            esac
          done
          echo "Écran de démarrage appliqué."

      # 7b. Configurer les permissions Android pour l'installateur d'APK
      - name: Configurer les permissions de mise à jour
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="cache" path="." />
              <files-path name="files" path="." />
              <external-path name="external" path="." />
          </paths>
          EOF

          python3 <<'PY'
          import re
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          contenu = manifest.read_text(encoding="utf-8")

          permissions = [
              # Installation de la mise à jour APK téléchargée par l'auto-updater.
              '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />',
              # Micro : dictée, discussion vocale avec le conseiller.
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
              '<uses-feature android:name="android.hardware.microphone" android:required="false" />',
          ]
          for perm in permissions:
              if perm not in contenu:
                  contenu = contenu.replace("<application", perm + "\n\n    <application", 1)

          # Autorise l'application à voir les services de reconnaissance vocale
          # installés (obligatoire depuis Android 11 / package visibility).
          requetes = '''
              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>
          '''
          if "android.speech.RecognitionService" not in contenu:
              contenu = contenu.replace("<application", requetes + "\n    <application", 1)

          if "androidx.core.content.FileProvider" not in contenu:
              provider = '''
              <provider
                  android:name="androidx.core.content.FileProvider"
                  android:authorities="${applicationId}.fileprovider"
                  android:exported="false"
                  android:grantUriPermissions="true">
                  <meta-data
                      android:name="android.support.FILE_PROVIDER_PATHS"
                      android:resource="@xml/file_paths" />
              </provider>
          '''
              contenu = contenu.replace("</application>", provider + "\n        </application>", 1)

          manifest.write_text(contenu, encoding="utf-8")
          print("AndroidManifest.xml configuré pour l'auto-update.")
          PY

      # 7c. Brancher le contrôle natif d'intégrité
      - name: Installer le plugin d'intégrité natif
        run: |
          DEST=android/app/src/main/java/com/superapp/budget
          mkdir -p "$DEST"
          cp native/android/IntegriteAppPlugin.java "$DEST/IntegriteAppPlugin.java"

          python3 <<'PY'
          from pathlib import Path

          activite = Path("android/app/src/main/java/com/superapp/budget/MainActivity.java")
          code = activite.read_text(encoding="utf-8")
          if "IntegriteAppPlugin" not in code:
              if code.rstrip().endswith("BridgeActivity {}"):
                  code = code.replace(
                      "public class MainActivity extends BridgeActivity {}",
                      "public class MainActivity extends BridgeActivity {\n"
                      "    @Override\n"
                      "    public void onCreate(android.os.Bundle savedInstanceState) {\n"
                      "        registerPlugin(IntegriteAppPlugin.class);\n"
                      "        super.onCreate(savedInstanceState);\n"
                      "    }\n}\n",
                      1,
                  )
              else:
                  code = code.replace(
                      "public class MainActivity extends BridgeActivity {",
                      "public class MainActivity extends BridgeActivity {\n"
                      "    @Override\n"
                      "    public void onCreate(android.os.Bundle savedInstanceState) {\n"
                      "        registerPlugin(IntegriteAppPlugin.class);\n"
                      "        super.onCreate(savedInstanceState);\n"
                      "    }\n",
                      1,
                  )
              activite.write_text(code, encoding="utf-8")
          print("Plugin d'intégrité natif installé et enregistré.")
          PY

      # 8. Reprendre le numéro de version depuis src/lib/version.ts
      - name: Appliquer le numéro de version
        run: |
          VERSION=$(grep -oP 'VERSION_APPLICATION = "\K[0-9.]+' src/lib/version.ts)
          CODE=$(echo "$VERSION" | awk -F. '{printf "%d%03d%03d", $1, $2, $3}')
          echo "Version compilée : $VERSION (code $CODE)"
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" android/app/build.gradle
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # 9. Installer la clé de signature depuis les secrets du dépôt (si présente)
      - name: Préparer la signature Release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          PRESENTS=0
          [ -n "$KEYSTORE_BASE64" ] && PRESENTS=$((PRESENTS + 1))
          [ -n "$KEYSTORE_PASSWORD" ] && PRESENTS=$((PRESENTS + 1))
          [ -n "$KEY_ALIAS" ] && PRESENTS=$((PRESENTS + 1))
          [ -n "$KEY_PASSWORD" ] && PRESENTS=$((PRESENTS + 1))

          if [ "$PRESENTS" -eq 0 ]; then
            echo "::warning::Aucun secret de signature configuré. Compilation d'un APK de test (debug)."
            echo "MODE=debug" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ "$PRESENTS" -ne 4 ]; then
            echo "::error::Secrets incomplets : les quatre secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS et ANDROID_KEY_PASSWORD doivent être renseignés."
            exit 1
          fi

          # Seuls les espaces et retours à la ligne sont retirés. Contrairement
          # à `tr -dc`, ceci ne transforme pas silencieusement un texte incorrect
          # en faux Base64 apparemment valide.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' > /tmp/keystore.base64
          if ! grep -Eq '^[A-Za-z0-9+/]+={0,2}$' /tmp/keystore.base64; then
            echo "::error::ANDROID_KEYSTORE_BASE64 contient des caractères invalides. Copiez uniquement le contenu complet de cle-signature.base64.txt, sans guillemets."
            exit 1
          fi
          if ! base64 --decode /tmp/keystore.base64 > android/app/cle-signature.jks 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 est incomplet ou tronqué. Remplacez-le avec tout le contenu de cle-signature.base64.txt."
            exit 1
          fi
          if [ ! -s android/app/cle-signature.jks ]; then
            echo "::error::La clé décodée est vide. Remplacez ANDROID_KEYSTORE_BASE64."
            exit 1
          fi

          echo "Clé décodée : $(wc -c < android/app/cle-signature.jks) octets."
          echo "Empreinte SHA-256 : $(sha256sum android/app/cle-signature.jks | cut -d' ' -f1)"

          if ! keytool -list -keystore android/app/cle-signature.jks -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::La clé est lisible, mais ANDROID_KEYSTORE_PASSWORD ne correspond pas au mot de passe utilisé lors de sa création."
            exit 1
          fi
          if ! keytool -list -keystore android/app/cle-signature.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::La clé et son mot de passe sont valides, mais ANDROID_KEY_ALIAS est incorrect. Sa valeur attendue est : superapp"
            exit 1
          fi

          echo "MODE=release" >> "$GITHUB_ENV"
          cp signature-release.gradle android/app/signature-release.gradle
          echo "apply from: 'signature-release.gradle'" >> android/app/build.gradle
          echo "Signature Release configurée et validée avec succès."

      # 10. Compiler l'APK
      - name: Compiler l'APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$MODE" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      # 11. Préparer l'APK et le fichier version.json de l'auto-updater
      - name: Préparer les fichiers de publication
        run: |
          mkdir -p publication
          if [ "$MODE" = "release" ]; then
            SRC=android/app/build/outputs/apk/release/app-release.apk
          else
            SRC=android/app/build/outputs/apk/debug/app-debug.apk
          fi

          # Contrôle de cohérence : sans APK valide, la Release serait publiée
          # avec un version.json pointant vers un fichier inexistant, ce qui
          # casserait l'auto-updater de tous les téléphones.
          if [ ! -s "$SRC" ]; then
            echo "::error::APK introuvable : $SRC. La compilation n'a pas produit de fichier."
            exit 1
          fi
          TAILLE=$(wc -c < "$SRC")
          if [ "$TAILLE" -lt 1000000 ]; then
            echo "::error::APK anormalement petit ($TAILLE octets) : $SRC. Compilation probablement corrompue."
            exit 1
          fi

          cp "$SRC" "publication/super-app-$VERSION.apk"
          BASE="https://github.com/${{ github.repository }}/releases/latest/download"

          # Empreinte SHA-256 de l'APK : l'application la vérifie après
          # téléchargement pour refuser tout fichier tronqué ou corrompu.
          EMPREINTE=$(sha256sum "publication/super-app-$VERSION.apk" | awk '{print $1}')

          printf '{\n  "version": "%s",\n  "url": "%s/super-app-%s.apk",\n  "changelog": "Nouvelle version %s de SUPER APP.",\n  "sha256": "%s",\n  "taille": %s\n}\n' \
            "$VERSION" "$BASE" "$VERSION" "$VERSION" "$EMPREINTE" "$TAILLE" > publication/version.json

          # Vérification immédiate du manifeste : JSON lisible, version, URL,
          # empreinte SHA-256 et taille cohérentes avec l'APK publié.
          python3 - "$VERSION" "$EMPREINTE" "$TAILLE" <<'PY'
          import json, re, sys
          version, empreinte, taille = sys.argv[1], sys.argv[2], int(sys.argv[3])
          with open("publication/version.json", encoding="utf-8") as f:
              m = json.load(f)
          assert m.get("version") == version, "version.json : version incorrecte"
          assert m.get("url", "").endswith(f"super-app-{version}.apk"), "version.json : url incorrecte"
          assert re.fullmatch(r"[0-9a-f]{64}", m.get("sha256", "")), "version.json : sha256 invalide"
          assert m.get("sha256") == empreinte, "version.json : sha256 incohérent avec l'APK"
          assert m.get("taille") == taille, "version.json : taille incohérente avec l'APK"
          print("version.json valide :", m)
          PY

          echo "### APK compilé ($MODE) : version $VERSION ($TAILLE octets)" >> "$GITHUB_STEP_SUMMARY"

      # 12. Rendre l'APK téléchargeable depuis la page du workflow
      - name: Publier l'APK en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: super-app-apk
          path: publication/
          retention-days: 30

      # 13. Créer la Release GitHub utilisée par la mise à jour automatique.
      # Toujours publiée (release signée ou debug) afin que version.json existe
      # toujours : sans manifeste, l'auto-updater des téléphones ne voit rien.
      # En mode debug, la Release est marquée "pré-release" pour signaler
      # qu'elle n'est pas destinée à la distribution.
      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: SUPER APP ${{ env.VERSION }}${{ env.MODE == 'debug' && ' (TEST — non signée)' || '' }}
          body: |
            Nouvelle version ${{ env.VERSION }} de SUPER APP.
            Mode de compilation : ${{ env.MODE }}.
          prerelease: ${{ env.MODE == 'debug' }}
          make_latest: ${{ env.MODE == 'release' }}
          files: |
            publication/super-app-${{ env.VERSION }}.apk
            publication/version.json
