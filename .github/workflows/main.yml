name: Compiler l'APK Android

# Ce workflow compile l'application mobile Android.
# Lancement : onglet "Actions" → "Compiler l'APK Android" → "Run workflow".
#
# Si les 4 secrets ANDROID_* sont enregistrés, l'APK est compilé en version
# Release SIGNÉE (recommandé, permet les mises à jour par-dessus l'app).
# S'ils sont absents, le workflow ne échoue plus : il compile un APK de test
# (debug) pour que vous ayez quand même une application installable.
"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      # 1. Récupérer le code source du projet
      - name: Récupérer le code
        uses: actions/checkout@v5

      # 2. Installer Bun (gestionnaire de paquets du projet)
      - name: Installer Bun
        uses: oven-sh/setup-bun@v2

      # 3. Installer les dépendances du projet
      - name: Installer les dépendances
        run: bun install --frozen-lockfile || bun install

      # 4. Construire la version web mobile (fichiers statiques)
      - name: Construire l'application web mobile
        run: bunx vite build --config vite.mobile.config.ts

      # 5. Installer Java (nécessaire pour compiler Android)
      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # 6. Installer les outils Android
      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      # 7. Créer le projet Android natif et y copier l'application
      - name: Préparer la coque Android (Capacitor)
        run: |
          if [ ! -d android ]; then bunx cap add android; fi
          bunx cap sync android

      # 8. Reprendre le numéro de version depuis src/lib/version.ts
      - name: Appliquer le numéro de version
        run: |
          VERSION=$(grep -oP 'VERSION_APPLICATION = "\K[0-9.]+' src/lib/version.ts)
          CODE=$(echo "$VERSION" | awk -F. '{printf "%d%03d%03d", $1, $2, $3}')
          echo "Version compilée : $VERSION (code $CODE)"
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" android/app/build.gradle
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # 9. Installer la clé de signature depuis les secrets du dépôt (si présente)
      - name: Préparer la signature Release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Secrets de signature incomplets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ou ANDROID_KEY_PASSWORD manquant). Compilation d'un APK de test (debug)."
            echo "MODE=debug" >> "$GITHUB_ENV"
          else
            # Nettoyage du Base64 et décodage
            # tr -dc 'A-Za-z0-9+/=' supprime tout ce qui n'est pas du base64 (espaces, retours ligne, etc.)
            printf '%s' "$KEYSTORE_BASE64" | tr -dc 'A-Za-z0-9+/=' | base64 -d > android/app/cle-signature.jks 2>/dev/null || true
            
            # Validation réelle de l'intégrité et des identifiants via keytool
            if [ -s android/app/cle-signature.jks ] && keytool -list -keystore android/app/cle-signature.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
              echo "MODE=release" >> "$GITHUB_ENV"
              cp signature-release.gradle android/app/signature-release.gradle
              echo "apply from: 'signature-release.gradle'" >> android/app/build.gradle
              echo "Signature Release configurée et validée avec succès."
            else
              echo "::error::Échec de validation de la clé. Causes possibles : 1) Le secret ANDROID_KEYSTORE_BASE64 est mal copié. 2) Le mot de passe ou l'alias est incorrect. 3) Le fichier est corrompu."
              rm -f android/app/cle-signature.jks
              echo "MODE=debug" >> "$GITHUB_ENV"
            fi
          fi

      # 10. Compiler l'APK
      - name: Compiler l'APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$MODE" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      # 11. Préparer l'APK et le fichier version.json de l'auto-updater
      - name: Préparer les fichiers de publication
        run: |
          mkdir -p publication
          if [ "$MODE" = "release" ]; then
            SRC=android/app/build/outputs/apk/release/app-release.apk
          else
            SRC=android/app/build/outputs/apk/debug/app-debug.apk
          fi
          cp "$SRC" "publication/super-app-$VERSION.apk"
          BASE="https://github.com/${{ github.repository }}/releases/latest/download"
          printf '{\n  "version": "%s",\n  "url": "%s/super-app-%s.apk",\n  "changelog": "Nouvelle version %s de SUPER APP."\n}\n' \
            "$VERSION" "$BASE" "$VERSION" "$VERSION" > publication/version.json
          cat publication/version.json
          echo "### APK compilé ($MODE) : version $VERSION" >> "$GITHUB_STEP_SUMMARY"

      # 12. Rendre l'APK téléchargeable depuis la page du workflow
      - name: Publier l'APK en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: super-app-apk
          path: publication/
          retention-days: 30

      # 13. Créer la Release GitHub utilisée par la mise à jour automatique
      - name: Créer la Release GitHub
        if: env.MODE == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: SUPER APP ${{ env.VERSION }}
          body: Nouvelle version ${{ env.VERSION }} de SUPER APP.
          files: |
            publication/super-app-${{ env.VERSION }}.apk
            publication/version.json
