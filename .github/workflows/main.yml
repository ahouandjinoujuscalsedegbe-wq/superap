name: Compiler l'APK Android

# Ce workflow compile automatiquement l'application mobile Android (APK).
# Il se lance manuellement depuis GitHub : onglet "Actions" →
# "Compiler l'APK Android" → bouton "Run workflow".
"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      # 1. Récupérer le code source du projet
      - name: Récupérer le code
        uses: actions/checkout@v4

      # 2. Installer Bun (gestionnaire de paquets du projet)
      - name: Installer Bun
        uses: oven-sh/setup-bun@v2

      # 3. Installer les dépendances du projet
      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      # 4. Construire la version web mobile (fichiers statiques)
      - name: Construire l'application web mobile
        run: bunx vite build --config vite.mobile.config.ts

      # 5. Créer le projet Android natif et y copier l'application
      - name: Préparer la coque Android (Capacitor)
        run: |
          bunx cap add android
          bunx cap sync android

      # 6. Installer Java (nécessaire pour compiler Android)
      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 7. Installer les outils Android
      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      # 8. Compiler l'APK
      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 9. Rendre l'APK téléchargeable depuis la page du workflow
      - name: Publier l'APK en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: super-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
