// Signature de l'APK Release.
// Ce fichier est copié dans android/app/ par GitHub Actions, qui fournit
// la clé (cle-signature.jks) et les mots de passe via les secrets du dépôt.
android {
    signingConfigs {
        release {
            storeFile file("cle-signature.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
